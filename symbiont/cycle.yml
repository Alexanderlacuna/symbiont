# CYCLE.YML — THE SENTINEL CYCLE'S ONE CONFIG (req-P1-THE-SENTINEL-CYCLE-the-stations-own, 2026-11-11)
# Design: reports/DESIGN-SENTINEL.md. Reader: symbiont/cycle.py — the ONLY code that parses this file.
#
# SHIPPED OFF. `enabled: false` below is the owner's default, quoted from the row: "cycle.yml shipped
# with enabled: false". While it is false the cycle does NOTHING AT ALL: no request leaves the box, no
# report is written, no store is touched, no state file is created. An operator turns it on deliberately.
# (DESIGN-SENTINEL §2 proposed a per-mode switch — watch on, discover off. The row shipped ONE switch,
# so the mode below picks the behaviour and `enabled` is the door. The reading half is still the safe
# half: `mode: watch` never adds anything to the corpus.)
#
# AN UNREADABLE OR MALFORMED CYCLE.YML MAKES THE CYCLE REFUSE TO START, NAMING THE PARSE ERROR
# (REFUSED[cycle-malformed], exit 2). A cycle that guesses at its own budget, its own surfaces or its
# own admission default is not a bounded loop; it is an unbounded one with good manners.
#
# WHO OWNS WHAT: the operator owns this file (budget, surfaces, provider, the admission default).
# The station only READS it, and refuses BY NAME every way the file can be wrong (an unknown key is
# refused, the sources.yml doctrine: the config and the code must not disagree about what exists).
version: 1

# ── THE DOOR ─────────────────────────────────────────────────────────────────────────────────────
enabled: false          # false = the cycle does nothing at all (quoted); true = it runs on its cadence
mode: watch             # watch (telemetry only, reads) | discover (adds to the corpus) | both
every: weekly           # the cadence the deployment expects; `cycle_status` reports the next due

# ── ITS OWN BUDGET — per run, the whole cycle, never the farm's ──────────────────────────────────
budget:
  requests: 60          # every request is charged before it leaves (symbiont/http.py::Fetcher)
  bytes: 4000000        # the cap on bytes read this run
  wall_s: 900           # the cap on wall clock this run; over it the cycle STOPS and records why
rate_limit:             # politeness: GitHub's unauthenticated search budget is 10 requests/minute
  requests_per_minute: 10
  min_interval_s: 2.0

# ── WHERE THE DEPLOYMENT'S OWN THINGS LIVE ──────────────────────────────────────────────────────
store: symbiont/store                 # digests (telemetry), run records, the cycle's own state
report_dir: reports/cycle             # one CYCLE-REPORT-<stamp>.md per run
state_dir: symbiont/store/cycle       # seen-set (append-only) + the last run record
admission:
  dir: symbiont/store/admission        # candidates · evaluations · sandbox receipts · cards
  sources_config: symbiont/sources.yml # the card registers a candidate here as enabled:false
  drafts_dir: symbiont/adapters_draft  # outside symbiont/adapters/, so a draft never becomes live
  adapters_dir: symbiont/adapters
  gate_file: symbiont/admission-gate.txt
  policy: reports/symbiont-policy.yml  # THE owner's policy — the only definition site of N

# ── WHERE IT MAY LOOK (it never invents a surface) ──────────────────────────────────────────────
surfaces:
  # THE DEPLOYMENT'S OWN SURFACE REGISTRY. Missing or empty -> REFUSED[no-surfaces]: the cycle does
  # not invent where to look. Two forms are read:
  #   · a plain line-based registry (this one): one listed query per line, `#` comments — the same
  #     file the logged GitHub sweep uses (tools/discover-sweep.sh), so the two cannot drift;
  #   · a structured <registry>.yml naming surfaces explicitly (kind + candidates with their own
  #     count_endpoint), for a deployment that knows how to count what it lists.
  registry: tools/discover-sweep.queries.txt
  kind: github_search           # how a PLAIN registry's queries are read (a .yml names its own)
  endpoint: https://api.github.com/search/repositories
  per_page: 10                  # results per query; the count is the API's own total_count
  dead_days: 730                # no push in this long -> REFUSED[dead-repo] (the sweep's own rule)
  seed_topics: 3                # a `seed:owner/repo` line expands to its first N topics

# ── DRAFTING (the optional, expensive, model-written step) ──────────────────────────────────────
draft:
  # EMPTY = NO DRAFTING. A candidate that passes evaluation is reported as PROPOSED and nothing is
  # built: no adapter is written, no model is called, no key of ours is ever used. Set this to the
  # deployment's OWN provider command (it is run with <candidate.json> <draft.py> and must write the
  # adapter) to let the cycle draft; the draft is then sandboxed and its count verified before any
  # card is cut.
  provider: ""

# ── THE GATED STEP ──────────────────────────────────────────────────────────────────────────────
admit:
  # THE GOVERNANCE GATE (DESIGN-SENTINEL §7). The council question — "May the SHIPPED station admit
  # a data source by policy with no human in the runtime loop?" — is PENDING; it was asked
  # 2026-11-11 01:45 and the record was DOWNGRADED TO PARKED (review failed, one family only).
  # Until a ruling that PERMITS it is on record, `by_policy: true` is REFUSED BY NAME and names the
  # ruling file it read. The cycle never decides this question; it only refuses to pretend it was
  # answered.
  by_policy: false
  # the ruling record that would permit admit-by-policy. Empty = none on record. The cycle reads the
  # file and requires a DECISION line that chooses option A (admit-by-policy, off by default) and a
  # STATUS line that is not PARKED/DOWNGRADED/REJECTED/UNREVIEWED. N itself is NEVER read from here:
  # N is reports/symbiont-policy.yml's stable_cycles_before_self_admit, one definition site.
  ruling: ""
